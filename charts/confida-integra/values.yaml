# SKELETON values — placeholders only. See README.md.

image:
  # The product is distributed as a signed image; set your registry/tag.
  repository: registry.example.org/confida/confida-integra
  tag: "0.9.6"            # use an exact SemVer tag, never :latest in production
  pullPolicy: IfNotPresent

replicaCount: 1            # the dashboard is single-replica (in-process session/state)

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

# Mounted config/data — wired up properly in the production chart (TODO: F41).
persistence:
  enabled: false
  size: 1Gi

# Extra environment variables (e.g. CI_OCP_TOKEN_0, CI_PVE_TOKEN — prefer a Secret).
env: {}


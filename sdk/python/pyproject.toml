[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "confida-integra-client"
version = "0.1.0"
description = "Python client for the Confida Integra northbound API"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Confida Solutions Oy", email = "info@confida.solutions" }]
keywords = ["confida", "integration", "cmdb", "openshift", "proxmox", "register"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  # No "License ::" classifier on purpose: PEP 639 makes the SPDX
  # `license` expression above and the legacy classifiers mutually
  # exclusive, and PyPI rejects an upload carrying both.
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://confida.solutions"
Repository = "https://github.com/ConfidaSolutions/confida-integra"
Documentation = "https://github.com/ConfidaSolutions/confida-integra/tree/main/spec"

[project.optional-dependencies]
test = ["pytest>=8.0", "respx>=0.21", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["confida_integra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

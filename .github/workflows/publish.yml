name: publish

# Publishes confida-integra-client to PyPI via Trusted Publishing (OIDC) - no
# API token is stored in this repository.
#
# The `pypi` environment is the deliberate step: pushing a tag does not release
# on its own, it queues a job that waits for approval in the environment's
# protection rules. Configure those in Settings -> Environments; without them
# the tag alone is enough.
#
# A PyPI version can never be re-uploaded, only yanked, so the release job is
# gated on the tag agreeing with sdk/python/pyproject.toml and with VERSION.

on:
  push:
    tags: ["sdk-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to upload"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must agree with the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          packaged=$(grep -m1 '^version' sdk/python/pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$packaged" ]; then
            echo "tag sdk-v$tag but pyproject.toml says $packaged" >&2
            exit 1
          fi
          echo "releasing $packaged"

      - run: pip install build twine
      - run: python -m build sdk/python

      - name: Metadata must be acceptable before anything is uploaded
        run: twine check sdk/python/dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: sdk/python/dist/

  testpypi:
    # The dry run: manual only, and never on a tag. TestPyPI accepts a version
    # once too, so use a .devN or .rcN suffix when rehearsing the same release
    # twice.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: startsWith(github.ref, 'refs/tags/') || inputs.target == 'pypi'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

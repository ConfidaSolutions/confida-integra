name: lint

on:
  push:
  pull_request:

jobs:
  json-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON Schema is well-formed
        run: python -c "import json; json.load(open('spec/integration-node.schema.json')); print('schema OK')"

  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: yamllint
        # Config lives in .yamllint.yml so a contributor gets the same result
        # locally. Helm templates are excluded there: {{- ... }} is Go template
        # syntax, not YAML, and no YAML parser can read them.
        run: |
          pip install yamllint
          yamllint spec charts examples

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: markdownlint
        # Globs and rules come from .markdownlint-cli2.jsonc, so `npx
        # markdownlint-cli2` with no arguments is exactly what CI runs.
        run: npx --yes markdownlint-cli2
